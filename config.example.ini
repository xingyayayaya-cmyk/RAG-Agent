# MySQL 配置（local_mode=true 时不使用，仅保留兼容远程模式）
[mysql]
host = 192.168.21.226
user = root
password = root
database = subjects_kg

# Redis 配置（local_mode=true 时使用内存缓存降级）
[redis]
host = 192.168.21.226
port = 16379
password = 1234
db = 2

# 日志配置
[logger]
log_file = logs/app.log

# Milvus 配置（collection_name 已切换为电商域）
# 注意：MILVUS_HOST / MILVUS_PORT / MILVUS_DATABASE_NAME / MILVUS_COLLECTION_NAME
# 支持环境变量覆盖（见 base/config.py），Docker 部署无需修改本文件
[milvus]
host = 192.168.21.226
port = 19530
database_name = milvus_demo
collection_name = ecom

# 检索参数配置, retrieval_k 是子块召回数量，candidate_m是最相关的父块（重排得分）数量。一般retrieval_k 要大于 candidate_m
[retrieval]
parent_chunk_size = 1000
child_chunk_size = 300
chunk_overlap = 50
retrieval_k = 10
candidate_m = 5

# LLM 配置（OpenAI 兼容接口）
# 安全提示：不要把真实 API Key 写进本文件并提交！
# 运行时通过环境变量 DASHSCOPE_API_KEY 传入（docker-compose 已配置）
[llm]
model = deepseek-chat
dashscope_base_url = https://api.deepseek.com/
dashscope_api_key = sk-your-deepseek-api-key

# 应用配置
[app]
valid_sources = ["product", "order", "policy"]
customer_service_phone = 400-888-8888
# 本地降级开关：true=用 SQLite + 本地向量库 + 内存缓存（开箱即用）；false=连远程 MySQL/Redis/Milvus
local_mode = true
# 本地文件路径（相对项目根目录）
milvus_local_db = data/milvus_lite.db
sqlite_db = data/ecom.db
# 业务表名
faq_table = ecom_faq
orders_table = orders
conversation_table = conversations
# 各平台大额订单阈值（元），升级 Agent 用
escalation_thresholds = {"淘宝": 5000, "京东": 10000, "拼多多": 3000, "抖音": 8000, "1688": 20000}
