services:
  app:
    build: .
    container_name: ecom-cs-app
    ports:
      - "18080:18080"
    environment:
      # DeepSeek API Key（必填；也可写入同目录 .env 文件）
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      # HuggingFace 镜像（国内网络；Dockerfile 内已带默认值）
      HF_ENDPOINT: ${HF_ENDPOINT:-https://hf-mirror.com}
    volumes:
      - model-cache:/app/rag_qa/models   # 模型缓存：首次启动下载约 4GB，仅需一次
      - app-data:/app/data               # SQLite 种子库 / Milvus Lite / 向量索引持久化
    restart: unless-stopped

volumes:
  model-cache:
  app-data: