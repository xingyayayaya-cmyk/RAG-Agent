# 电商智能客服一体化部署
# 首次启动会自动下载 BGE-M3 / bge-reranker-large / bert-base-chinese（约 4-5GB，走 HF_ENDPOINT 镜像源）
services:
  app:
    build: .
    container_name: kj-dianshang-app
    ports:
      - "18080:18080"
    environment:
      # 必填：DeepSeek API Key（OpenAI 兼容接口）
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      # HuggingFace 镜像源（国内默认走 hf-mirror，可覆盖为 huggingface.co）
      HF_ENDPOINT: ${HF_ENDPOINT:-https://hf-mirror.com}
      # 数据灌库目录（容器内路径，默认已指向镜像内 dataset/）
      ECOM_DATA_DIR: ${ECOM_DATA_DIR:-/app/dataset}
    volumes:
      # 源数据集（宿主机目录挂载，只读；灌库脚本 ecom_data/ingest.py 使用）
      - ./dataset:/app/dataset:ro
      # 模型持久化：首次下载后重启不再重复下载
      - model-cache:/app/rag_qa/models
      # 业务数据（SQLite / 本地向量库）持久化
      - app-data:/app/data
    restart: unless-stopped

volumes:
  model-cache:
  app-data:
